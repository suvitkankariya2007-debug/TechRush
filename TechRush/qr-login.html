<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultID - Cross-Device QR Approval</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            color: #f8fafc;
        }
        .approval-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 1.5rem;
        }
        .icon-badge {
            width: 70px;
            height: 70px;
            background: rgba(56, 189, 248, 0.1);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #38bdf8;
            font-size: 1.75rem;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.75rem;
            line-height: 1.5;
        }
        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            font-size: 0.825rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-group input:focus {
            border-color: #38bdf8;
        }
        .btn-approve {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-approve:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
        .status-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .status-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>
<body>

    <div class="approval-card">
        <div class="logo">
            <i class="fas fa-shield-halved"></i>
            <span>VaultID</span>
        </div>

        <div class="icon-badge">
            <i class="fas fa-qrcode"></i>
        </div>

        <h2>Authorize Sign-In</h2>
        <p class="subtitle">A device is requesting passwordless sign-in to VaultID. Enter your registered email to approve access.</p>

        <form id="approvalForm">
            <div class="input-group">
                <label for="approveEmail">Your VaultID Email Address</label>
                <input type="email" id="approveEmail" placeholder="e.g. vaulttest3@example.com" required>
            </div>

            <button type="submit" id="submitApproveBtn" class="btn-approve">
                <i class="fas fa-circle-check"></i> Approve Sign In
            </button>
        </form>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const API_BASE = `${window.location.protocol}//${window.location.hostname}:8000/api/v1`;

        document.getElementById('approvalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('approveEmail').value.trim();
            const statusBox = document.getElementById('statusBox');
            const submitBtn = document.getElementById('submitApproveBtn');

            if (!sessionId) {
                statusBox.className = 'status-box status-error';
                statusBox.style.display = 'block';
                statusBox.textContent = '❌ Invalid or missing session_id parameter.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authorizing...';

            try {
                const res = await fetch(`${API_BASE}/auth/qr/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, email: email })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || data.message || 'Approval failed');
                }

                statusBox.className = 'status-box status-success';
                statusBox.style.display = 'block';
                statusBox.innerHTML = `🎉 <strong>Sign-in Approved!</strong><br><span style="font-size:0.825rem;">Authorized for ${email}. You can close this window now.</span>`;
                submitBtn.style.display = 'none';

            } catch (err) {
                statusBox.className = 'status-box status-error';
                statusBox.style.display = 'block';
                statusBox.textContent = `❌ ${err.message}`;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-circle-check"></i> Approve Sign In';
            }
        });
    </script>
</body>
</html>
